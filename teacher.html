<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교사용 · 주사위 칩 대결</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script src="dice-core.js"></script>

<style>
body{font-size:16px}
.wrap{max-width:1400px;margin:0 auto;padding:14px 18px 40px}
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.head h1{font-size:22px;font-weight:900}
.codebox{display:flex;align-items:baseline;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.code{font-size:34px;font-weight:900;letter-spacing:6px;color:var(--acc)}
.url{font-size:13px;color:var(--muted);max-width:330px;word-break:break-all}
.sp{flex:1}
#badge{font-size:14px;font-weight:700;color:var(--muted)}
#badge.on{color:var(--o)}
button.sm{padding:7px 12px;font-size:14px}
.cols{display:grid;grid-template-columns:290px 1fr;gap:14px;align-items:start}
.side .card h3{font-size:15px;margin-bottom:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;background:#fff;color:var(--ink);border:2px solid var(--line);padding:9px 8px;font-size:15px}
.seg button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.go{width:100%;font-size:18px;padding:14px;margin-top:6px}
.stu{list-style:none;max-height:440px;overflow:auto}
.stu li{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid #f0ece3;font-size:15px}
.stu .dot{width:9px;height:9px;border-radius:50%;background:#ccc;flex:none}.stu .dot.on{background:var(--o)}
.stu .nm{flex:1;font-weight:700}
.stu .ok{color:var(--o);font-weight:900}.stu .no{color:#bbb}
.stu .x{background:none;color:#aaa;padding:0 4px;font-size:13px;font-weight:400}
.stu .nm.pk{cursor:pointer;text-decoration:underline dotted #bbb;text-underline-offset:3px}.stu .nm.pk:hover{color:var(--acc,#2f5d9e)}
.stu .eye{background:none;color:#888;padding:0 2px;font-size:15px}
#peek{position:fixed;inset:0;background:rgba(29,36,51,.45);display:none;z-index:60;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
#peek.on{display:flex}
#peek .pbox{background:#fffdf8;border-radius:18px;width:min(760px,100%);padding:16px 18px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#peek .phd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:2px solid #eee6d6;padding-bottom:8px;margin-bottom:10px}
#peek .phd b{font-size:22px}#peek .tag{background:#f4f1ea;border-radius:999px;padding:3px 10px;font-size:14px;font-weight:700}
#peek .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#peek .die1{display:flex;gap:8px;align-items:center;justify-content:center;margin:6px 0}
#peek .die1 .sumv{font-size:30px;font-weight:900;font-family:"Times New Roman",serif}
@media(max-width:600px){#peek .two{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:15px;padding:9px 14px}
.tabs button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.stage{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;min-height:520px}
.sh{font-size:28px;font-weight:900;margin-bottom:4px}
.sd{color:var(--muted);font-size:17px;margin-bottom:14px}
.names{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.names span{border-radius:10px;padding:6px 12px;font-weight:700;background:#f2efe8;color:#999}
.names span.ok{background:var(--o-soft);color:var(--o)}
.bigcnt{font-size:64px;font-weight:900;color:var(--acc);line-height:1}
.rollbox{display:flex;align-items:center;gap:18px;justify-content:center;min-height:130px}
.rollbox .cnt{font-size:26px;font-weight:900;color:var(--muted);min-width:150px}
.rollbox .sumv{font-size:56px;font-weight:900;font-family:"Times New Roman",serif}
.resg{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-top:16px}
table.rk{border-collapse:collapse;width:100%;font-size:17px}
table.rk td,table.rk th{border-bottom:1px solid #eee7da;padding:6px 8px;text-align:center;vertical-align:middle}
table.rk td.nm{text-align:left;font-weight:700}
table.rk .minib{--bh:64px;width:240px}
table.rk .minib .bnum,table.rk .minib .blab{display:none}
.box2{border:1px solid var(--line);border-radius:14px;padding:12px 14px;--bh:150px}
.box2 h4{font-size:16px;margin-bottom:6px}
.opts{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:15px}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.simrow{display:grid;grid-template-columns:24px 220px 1fr 110px 110px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #f0ece3}
.simrow .sb{height:24px;background:#efece5;border-radius:6px;overflow:hidden}
.simrow .sb>div{height:100%;background:var(--acc);border-radius:6px}
.simrow .mb{--bh:40px}.simrow .mb .bnum,.simrow .mb .blab{display:none}
.simrow b{font-size:18px}
.sumtab{border-collapse:collapse;font-size:26px;font-family:"Times New Roman",serif;margin:8px auto}
.sumtab td,.sumtab th{width:70px;height:58px;text-align:center;border:2px solid #1d2433}
.sumtab th{background:#f4f1ea}
.sumtab td{cursor:pointer;font-weight:700}
.sumtab td.hl{background:#ffe3a3}
.balg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}.balg>div{display:flex;align-items:center;gap:6px;border-bottom:1px solid #f0ece3;padding:3px 0}.balg .nm{flex:1;font-weight:700}.balg b{font-size:18px;min-width:44px;text-align:right}.x2{background:#fff;color:var(--ink);border:1px solid var(--line);padding:2px 7px;font-size:13px;font-weight:400}
.nIn{display:flex;align-items:center;gap:4px;font-size:14px;width:100%;margin-top:4px}.nIn input{width:80px;padding:6px 8px}
.glist{display:grid;grid-template-columns:1fr;gap:10px}.gm .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.pct{display:flex;gap:6px;margin-top:2px}.pct div{flex:1;text-align:center;font-size:14px;color:var(--muted);font-weight:700}
table.mx{border-collapse:collapse;width:100%;background:#fff;font-size:15px}
table.mx th,table.mx td{border:1px solid #eee7da;padding:6px 8px;text-align:center}
table.mx th{background:#f7f4ee}
/* 📺 크게 보기: 진행 버튼만 작게 남기고 무대를 크게 */
body.proj .side,body.proj .head .hideP,body.proj .tabs{display:none!important}
body.proj .cols{grid-template-columns:1fr}
body.proj .wrap{max-width:none;padding:10px 24px}
body.proj .stage{border:none;min-height:calc(100vh - 110px);font-size:20px}
body.proj .sh{font-size:38px}body.proj .sd{font-size:22px}
body.proj .board .bnum{font-size:22px}body.proj .board .blab{font-size:30px}
#projBar{display:none;gap:8px;align-items:center}
body.proj #projBar{display:flex}

/* 📽 수업 슬라이드 (곱의 법칙 PPT 모양) */
#sl{display:none;position:fixed;inset:0;z-index:150;background:#222}
#sl.on{display:block}
#slFrame{position:absolute;width:1600px;height:900px;transform-origin:0 0;background:#fff;overflow:hidden;font-size:34px;color:#1d2433}
#slNav{position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#111;color:#ddd}
#slNav button{background:#333;color:#eee;padding:5px 12px;font-size:14px;border-radius:8px}
#slNav button.acc{background:#d9690f}
#slNav .sp{flex:1}#slNav .code2{font-size:15px}#slNav .code2 b{color:#ffb35c;font-size:20px;letter-spacing:3px}
.shd{height:120px;background:#000;display:flex;align-items:center;padding:0 60px}
.shd>.ed{flex:1;color:#f07c1e;font-size:60px;font-weight:700;letter-spacing:2px;text-align:center}
.stag{color:#fff;font-size:28px;line-height:1.3;text-align:right;min-width:160px}
.ed[contenteditable=true]{outline:3px dashed #f07c1e;outline-offset:4px;min-width:40px;min-height:1em}
#slFrame .ed b{color:#f07c1e;font-weight:700}
.scover{display:grid;grid-template-columns:1fr 1fr;height:100%}
.scover .dice{background:#1d2433;display:grid;grid-template-columns:repeat(3,1fr);place-items:center;padding:120px 60px}
.scover .ctext{display:flex;flex-direction:column;justify-content:center;padding:0 70px;color:#f07c1e}
.scover .ctext>div:nth-child(1){font-size:34px;color:#7a5af0}
.scover .ctext>div:nth-child(2){font-size:64px;margin-top:20px}
.scover .ctext>div:nth-child(3){font-size:48px;margin-top:6px}
.sgoal{padding:60px 110px;font-size:52px;line-height:1.6}
.sgoal .gl{margin-top:30px}.sgoal .ed{padding-left:110px}
.sjoin{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;padding:50px 70px;font-size:40px;line-height:1.7}
.sjoin .jr{text-align:center}.sjoin .qr{display:inline-block;padding:14px;background:#fff;border:2px solid #ddd;min-height:300px}
.sjoin .jc{font-size:44px;margin-top:14px}.sjoin .jc b{font-size:84px;letter-spacing:10px}.sjoin .ju{font-size:22px;color:#6b6f78;word-break:break-all}
.stext{padding:46px 80px;font-size:38px;line-height:1.75}
.stext p{margin-bottom:14px}.stext .center{text-align:center}.stext .big{font-size:46px}.stext .note{font-size:32px;color:#6b6f78}
.blank{display:inline-block;min-width:200px;border-bottom:4px solid #1d2433;color:transparent;cursor:pointer;text-align:center;padding:0 10px}
.blank.show{color:#cf3f54;font-weight:700}
.ed[contenteditable=true] .blank{color:#cf3f54;opacity:.6}
.sprompt{padding:18px 60px 6px;font-size:34px}
#slNav button.on2{background:#2e8b57}
.sask{padding:24px 60px}.sask .aq{font-size:40px;line-height:1.5}.sask .ah{font-size:26px;color:#6b6f78;margin-top:6px}
.sask .sctl{padding:14px 0}
.ans{position:absolute;left:60px;right:60px;top:400px;bottom:20px;overflow:auto;display:flex;flex-wrap:wrap;gap:14px;align-content:flex-start}
.ans .a{background:#fff6e8;border:3px solid #f0b46a;border-radius:18px;padding:12px 18px;max-width:460px;font-size:26px;line-height:1.4}
.ans .a .n{font-size:18px;color:#6b6f78;margin-top:4px}
.sctl{display:flex;gap:10px;align-items:center;padding:0 60px 8px;font-size:22px}
.sctl .st{flex:1;color:#6b6f78}.sctl button{font-size:22px;padding:10px 22px}
.slive{position:absolute;left:30px;right:30px;top:200px;bottom:16px;overflow:auto}
#sl .sctl~.slive{top:250px}
.slive .stage{border:none;padding:6px 10px;min-height:0;zoom:1.45}
.slive .stage>.sh{display:none}
@media (max-width:1000px){ .cols{grid-template-columns:1fr} .resg{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>🎲 주사위 확률 게임 <span class="muted hideP" style="font-weight:400;font-size:15px">교사용</span></h1>
    <div class="codebox"><span class="muted">수업 코드</span><span class="code" id="code">----</span></div>
    <div class="hideP"><div class="url" id="url"></div><button class="ghost sm" onclick="copyURL()" style="margin-top:4px">학생 주소 복사</button></div>
    <span class="sp"></span>
    <span id="badge" class="hideP">연결 준비 중…</span>
    <a href="index.html?solo=1" target="_blank" class="hideP"><button class="ghost sm">🤖 혼자 연습 화면</button></a>
    <button class="sm hideP" style="background:#d9690f" onclick="openSlides()">📽 수업 슬라이드</button>
    <button class="sm acc hideP" onclick="setProj(true)">📺 크게 보기</button>
    <div id="projBar"><button class="sm" id="pOpen" onclick="openRound()">새 판 열기</button><button class="sm acc" id="pRoll" onclick="closeAndRoll()">🎲 굴리기</button><button class="ghost sm" onclick="setProj(false)">✕ 크게 보기 끝</button></div>
  </div>
  <div id="peerErr" style="color:var(--x);margin-bottom:8px"></div>

  <div class="cols">
    <div class="side">
      <div class="card"><h3>단계</h3>
        <div class="seg" id="stSeg"></div>
        <h3 style="margin-top:12px">⚔ 1:1 대결: 굴리는 횟수</h3>
        <div class="seg" id="dnSeg"></div>
        <div class="muted" style="font-size:13px;margin-top:6px">바꾸면 새로 만드는 방부터 적용돼요.</div>
      </div>
      <div class="card"><h3>🪙 반 전체 칩 예측 <span class="muted" style="font-weight:400">(교사 진행)</span></h3>
        <div class="muted" style="font-size:13px;margin-bottom:4px">굴리는 횟수 = 칩 개수</div>
        <div class="seg" id="nSeg"></div>
        <div id="phTxt" class="muted"></div>
        <button class="go" id="openBtn" onclick="openRound()">새 판 열기</button>
        <button class="go acc" id="rollBtn" onclick="closeAndRoll()">🎲 마감하고 굴리기</button>
        <button class="ghost sm" id="waitBtn" onclick="toWait()" style="width:100%;margin-top:6px">결과 닫기 (학생 화면 → 대결로)</button>
        <div class="muted" style="font-size:13px;margin-top:6px">판을 열면 대결 중이 아닌 학생 화면이 칩 놓기로 바뀌어요.</div>
      </div>
      <div class="card"><h3>학생 <span class="muted" id="stuCnt"></span></h3><ul class="stu" id="stuList"></ul></div>
      <div class="card"><h3>✋ 전체 멈춤</h3>
        <input id="pauseMsg" type="text" maxlength="40" style="width:100%">
        <button id="pauseBtn" style="width:100%;margin-top:6px" onclick="togglePause()">멈추기</button></div>
      <div class="card"><h3>기록</h3>
        <div class="btns"><button class="ghost sm" onclick="exportCSV()">⬇ CSV</button><button class="ghost sm" onclick="resetAll()">🔄 점수 초기화</button>
        <button class="ghost sm" onclick="changeCode()" style="grid-column:1/3">새 수업 코드 만들기</button></div></div>
    </div>

    <div>
      <div class="tabs" id="tabs">
        <button data-v="duel">⚔ 1:1 대결</button>
        <button data-v="game">🪙 반 전체 칩 예측</button>
        <button data-v="sim">🔬 전략 대결 모의실험</button>
        <button data-v="many">📊 아주 많이 굴려 보기</button>
        <button data-v="table">🧮 두 주사위 합 표</button>
        <button data-v="rec">📒 기록</button>
      </div>
      <div id="stageHome"><div class="stage" id="stage"></div></div>
    </div>
  </div>
</div>
<div id="sl"><div id="slFrame"></div>
  <div id="slNav"><button onclick="goSlide(-1)">◀</button><span id="slPage"></span><button onclick="goSlide(1)">▶</button>
    <span class="sp"></span><span class="muted" style="font-size:13px">← → 키로 넘기기</span>
    <button id="slPauseOn" onclick="setPause(true)">✋ 멈추기</button><button id="slPauseOff" onclick="setPause(false)">▶ 활성화</button>
    <button id="slEditBtn" onclick="toggleSlEdit()">✏ 글 고치기</button><button onclick="resetSlide()">↺ 이 장 처음대로</button>
    <button onclick="document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()">⛶ 전체 화면</button>
    <span class="code2">코드 <b id="slCode"></b></span><button onclick="closeSlides()">✕ 닫기</button></div></div>
<div class="overlay" id="pauseOv"></div>
<div id="peek" onclick="if(event.target===this)closePeek()"><div class="pbox" id="peekBox"></div></div>
<div class="toast" id="toast"></div>

<script>
const APP_VER=20261127.1;   // index.html 과 같은 값이어야 함
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }};
let toastT; function toast(t,ms){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),ms||2600); }
document.head.insertAdjacentHTML('beforeend','<style>'+DC.css+'</style>');
function newCode(){ return String(1000+Math.floor(Math.random()*9000)); }

/* ---------- 장부 (이 화면이 원본) ---------- */
const DEF={code:null, st:1, n:30, ph:'wait', r:0, rolls:'', at:0, res:null, tot:{}, rounds:[], paused:false, pauseMsg:'선생님을 봐 주세요', resetAt:0, view:'duel', dn:null, games:{}, duel:{}, pt:{on:true,start:100,max:30,streak:3}, bal:{}, ask:{id:0,q:'',open:false}, theory:false, hideNames:false};
let S=Object.assign({},DEF,LS.get('dice-t',{}));
S.pt=Object.assign({},DEF.pt,S.pt||{}); S.bal=S.bal||{}; S.games=S.games||{}; S.duel=S.duel||{};
if(!S.code) S.code=newCode();
function save(){ LS.set('dice-t',S); }
let LIVE={}, ROOMS={};
function duelN(){ return DC.duelN(S.st).includes(S.dn)?S.dn:DC.duelN(S.st)[0]; }      // key → {name, online, ver, bet}
let OFFSET=0; const now=()=>Date.now()+OFFSET;
const fbName=k=>{ try{ return decodeURIComponent(k); }catch(e){ return k; } };
save();

/* ---------- 연결 (Firebase) ---------- */
const FB_OK=!!(window.firebase && window.FB_CONFIG && FB_CONFIG.apiKey && FB_CONFIG.databaseURL);
let db=null, base=null; if(FB_OK){ try{ firebase.initializeApp(FB_CONFIG); db=firebase.database(); }catch(e){ console.error(e); } }
function cfgObj(){ return {ver:APP_VER, st:S.st, n:S.n, ph:S.ph, r:S.r, rolls:S.rolls||'', at:S.at||0, res:S.res||null,
  tot:Object.fromEntries(Object.entries(S.tot).map(([k,v])=>[k,{s:v.s,w:v.w,g:v.g}])), dst:S.st, dn:duelN(), rec:Object.fromEntries(Object.entries(S.duel).map(([k,v])=>[k,{w:v.w,l:v.l,d:v.d}])), pt:S.pt, bal:S.bal, pair:pairAll(), ask:S.ask&&S.ask.open?{id:S.ask.id,q:S.ask.q}:null, paused:S.paused, pauseMsg:S.pauseMsg, resetAt:S.resetAt||0, t:firebase.database.ServerValue.TIMESTAMP}; }
function writeCfg(){ if(!base) return Promise.resolve(); return base.child('cfg').set(cfgObj()).catch(e=>{ $('peerErr').textContent='저장 실패: '+e.message; }); }
function studentURL(){ return location.href.replace(/[?#].*$/,'').replace(/teacher\.html$/,'')+'?c='+S.code; }
function showCode(){ $('code').textContent=S.code; $('url').textContent=studentURL(); }
function copyURL(){ const u=studentURL(); (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('학생 주소를 복사했어요')).catch(()=>{ prompt('학생 주소',u); }); }
let authP=null;
function authReady(){
  if(!authP) authP=new Promise((res,rej)=>{
    const un=firebase.auth().onAuthStateChanged(u=>{ un();
      if(u) res(u.uid); else firebase.auth().signInAnonymously().then(c=>res(c.user.uid)).catch(e=>{ authP=null; rej(e); }); });
  });
  return authP;
}
function isDenied(e){ return /permission|denied/i.test(String((e&&(e.code||''))+' '+(e&&e.message||''))); }
function authMsg(e){
  const c=String(e&&e.code||'');
  if(/admin-restricted|operation-not-allowed/.test(c)) return '익명 로그인이 꺼져 있어요. Firebase 콘솔 → Authentication → 로그인 방법에서 [익명]을 사용 설정하세요.';
  if(isDenied(e)) return '데이터베이스가 접근을 막았어요: '+e.message+' (데이터베이스 규칙에 dice 부분을 넣었는지 확인하세요)';
  return '연결 오류: '+(e&&e.message||e);
}
function openClass(tries=0){
  if(!FB_OK||!db){ $('badge').textContent='연결 설정 필요'; $('peerErr').textContent='firebase-config.js에 Firebase 설정값이 아직 없어요.'; return; }
  if(base){ try{ base.child('stu').off(); }catch(e){} }
  base=null; LIVE={};
  const code=S.code, ref=db.ref('dice/'+code);
  authReady().then(uid=>ref.child('owner').set(uid).then(()=>{
    if(S.code!==code) return;
    base=ref; writeCfg();
    base.child('rooms').on('value',snap=>{ ROOMS=snap.val()||{}; if(ingestRooms()){ save(); writeCfg(); } renderSide(); if(S.view==='duel') renderStage(); renderPeek(); }, ()=>{});
    base.child('stu').on('value',snap=>{ ingest(snap.val()||{}); renderSide(); if(S.view==='game'&&S.ph==='bet') renderStage(); renderPeek(); },
      e=>{ $('peerErr').textContent='읽기 실패: '+e.message+' (데이터베이스 규칙을 확인하세요)'; });
  }, e=>{
    if(S.code!==code) return;
    if(isDenied(e)&&tries<5){ S.code=newCode(); save(); showCode(); toast(`수업 코드 ${code}는 다른 화면에서 쓰고 있어서 새 코드 ${S.code}를 만들었어요`,5000); openClass(tries+1); return; }
    throw e;
  })).catch(e=>{ $('peerErr').textContent=authMsg(e); });
}
function startFB(){
  if(!FB_OK||!db){ openClass(); return; }
  db.ref('.info/connected').on('value',s=>{ const on=!!s.val(); $('badge').textContent=on?'● 연결됨':'연결 끊김 · 다시 연결하는 중'; $('badge').classList.toggle('on',on); if(on) $('peerErr').textContent=''; });
  db.ref('.info/serverTimeOffset').on('value',s=>{ OFFSET=+s.val()||0; });
  openClass();
}
function ingest(all){
  const live={};
  for(const k in all){ const v=all[k]||{}, p=v.p||{};
    live[k]={name:String(p.name||fbName(k)).slice(0,10), online:p.online===true, ver:+p.ver||0, bet:v.bet||null, ans:p.ans&&typeof p.ans.t==='string'?{id:p.ans.id,t:p.ans.t.slice(0,200)}:null}; }
  LIVE=live;
}
function kick(k){
  const nm=(LIVE[k]||{}).name||fbName(k);
  if(!confirm(`'${nm}' 이름을 이 기기에서 풀어 줄까요?\n학생이 다른 기기에서 같은 이름으로 들어올 수 있게 돼요. (점수는 그대로)`)) return;
  base&&base.child('stu/'+k).remove().then(()=>toast('풀어 주었어요')).catch(e=>toast('실패: '+e.message));
}

/* ---------- 판 진행 ---------- */
function betsNow(){ const b={}; for(const k in LIVE){ const x=LIVE[k].bet; if(x&&x.r===S.r&&DC.validChips(S.st,DC.chipsFor(S.n),x.c)) b[k]=x.c; } return b; }
function openRound(){
  if(S.ph==='bet'){ toast('이미 판이 열려 있어요'); return; }
  S.ph='bet'; S.r=Date.now(); S.rolls=''; S.at=0; S.res=null; save(); writeCfg(); S.view='game'; renderAll();
}
function closeAndRoll(){
  if(S.ph!=='bet'){ toast('먼저 [새 판 열기]를 누르세요'); return; }
  const bets=betsNow(), ks=Object.keys(bets);
  if(!ks.length&&!confirm('아직 칩을 제출한 학생이 없어요. 그래도 굴릴까요?')) return;
  const rolls=DC.roll(S.st,S.n), cnt=DC.counts(S.st,DC.decode(S.st,rolls));
  const sc={}; ks.forEach(k=>sc[k]=DC.pscore(bets[k],cnt,S.n)); const pct=S.n>60;   // 아주 많이 굴린 판(600·6000번)은 점수가 커서 누적 점수에는 넣지 않음
  const rk=DC.ranks(sc), best=ks.length?Math.max(...Object.values(sc)):0;
  const top=ks.filter(k=>sc[k]===best).slice(0,3).map(k=>bets[k]);
  ks.forEach(k=>{ const t=S.tot[k]||(S.tot[k]={name:LIVE[k].name,s:0,w:0,g:0}); t.name=LIVE[k].name; if(!pct){ t.s+=sc[k]; t.g++; } if(rk[k]===1) t.w++; });   // 많이 굴린 판은 누적 점수에 넣지 않음
  S.rounds.push({r:S.r, st:S.st, n:S.n, rolls, sc:Object.fromEntries(ks.map(k=>[LIVE[k].name,sc[k]])), bets:Object.fromEntries(ks.map(k=>[LIVE[k].name,bets[k]]))});
  S.ph='roll'; S.rolls=rolls; S.at=now()+1200; S.res={sc,rk,cnt:ks.length,best,top};
  save(); writeCfg(); S.view='game'; renderAll();
}

/* ---------- ⚔ 1:1 대결 ----------
   학생 방(dice/{코드}/rooms)을 지켜보다가 끝난 판을 전적에 넣음 (방번호-판번호로 한 번만) */
function finished(r){ return r&&r.a&&r.b&&r.a.rd&&r.b.rd&&Array.isArray(r.a.c)&&Array.isArray(r.b.c)&&String(r.rolls||'').length>=r.n*(r.st===2?2:1); }
/* 포인트: 잔액, 같은 상대 연속 판 수 */
function bal(k){ return S.bal[k]==null?S.pt.start:S.bal[k]; }
function pairOf(k){ const gs=Object.values(S.games).filter(g=>g.a.key===k||g.b.key===k).sort((a,b)=>b.t-a.t); if(!gs.length) return null;
  const op=g=>g.a.key===k?g.b.key:g.a.key, o=op(gs[0]); let n=0; for(const g of gs){ if(op(g)===o) n++; else break; } return {op:o,n}; }
function pairAll(){ const r={}; for(const k in S.duel){ const x=pairOf(k); if(x) r[k]=x; } return r; }
/* ⚠ Firebase는 내가 쓴 값의 'value' 이벤트를 set() 안에서 바로(같은 순간에) 다시 부름.
   예전에는 판을 장부에 적기 전에 stake를 써서, 같은 판이 두 번 정산되어 포인트·승패가 2배가 됐음.
   → 판을 먼저 장부에 적고, Firebase에는 다 끝난 뒤에 씀. 다시 불려도 그냥 나감. */
let INGESTING=false;
function ingestRooms(){
  if(INGESTING) return false;
  INGESTING=true; const out=[];
  try{ return ingestRooms0(out); }
  finally{ INGESTING=false; if(base) out.forEach(([rid,v])=>base.child('rooms/'+rid+'/stake').set(v).catch(()=>{})); }   // 학생 화면에 정산 결과 알려 줌
}
function ingestRooms0(out){
  let ch=false;
  for(const rid in ROOMS){ const r=ROOMS[rid]; if(!finished(r)) continue;
    const id=rid+'-'+(r.g||1)+'-'+(r.t||0); if(S.games[id]) continue;
    const st=r.st, list=DC.decode(st,r.rolls).slice(0,r.n);
    if(!DC.validChips(st,r.n,r.a.c)||!DC.validChips(st,r.n,r.b.c)) continue;
    const sa=DC.sum(DC.hits(st,r.a.c,list)), sb=DC.sum(DC.hits(st,r.b.c,list));
    /* 걸린 점수: 둘이 고른 것 중 작은 쪽, 한 판 최대, 두 사람 잔액 안에서. 같은 상대와 연속 제한을 넘으면 0 */
    let stake=0;

function dblFix(){ const fix={};   // 판마다 한 번 더 더해진 만큼 되돌림

  L.forEach((s,i)=>{ if(SIM.pick[s.id]==null) SIM.pick[s.id]=i<2||s.id.startsWith('s:')&&i<6; });
  el.innerHTML=`<div class="sh">🔬 전략 대결 모의실험</div>
    <div class="sd">${DC.stageName(st)} · 한 판에 ${n}번 굴림. 고른 전략들이 <b>똑같은 굴림</b>으로 여러 판 겨뤄요. 한 판은 운이지만, 많이 하면 어떤 전략이 유리한지 보여요.</div>
    <div class="seg" style="max-width:520px;margin-bottom:10px">${[1,10,100,1000].map(g=>`<button class="${SIM.games===g?'sel':''}" onclick="SIM.games=${g};renderStage()">${g}판</button>`).join('')}</div>
    <div>${L.map(s=>{ const r=SIM.out&&SIM.out[s.id];
      return `<div class="simrow"><input type="checkbox" ${SIM.pick[s.id]?'checked':''} onchange="SIM.pick['${esc(s.id)}']=this.checked"><div><b style="font-size:16px">${esc(s.name)}</b><div class="mb">${DC.boardHTML(st,s.c,null,{max:Math.ceil(n/3)})}</div></div>
        <div>${r?`<div class="sb"><div style="width:${(r.win/SIM.ran*100).toFixed(1)}%"></div></div>`:''}</div>
        <div>${r?`1등 <b>${Math.round(r.win)}</b>번<br><span class="muted">${(r.win/SIM.ran*100).toFixed(0)}%</span>`:''}</div>
        <div>${r?`평균 <b>${r.avg.toFixed(1)}</b>점`:''}</div></div>`; }).join('')}</div>
    <button class="acc" style="margin-top:14px;font-size:20px;padding:14px 26px" onclick="runSim()">▶ ${SIM.games}판 겨루기</button>
    <div class="muted" style="margin-top:8px">공동 1등은 1등 횟수를 나눠서 셉니다.</div>`;
}
function runSim(){
  const L=simStrats().filter(s=>SIM.pick[s.id]); if(L.length<2){ toast('전략을 두 개 이상 고르세요'); return; }
  const r=DC.simulate(S.st,S.n,L,SIM.games); SIM.out={}; SIM.ran=SIM.games; L.forEach((s,i)=>SIM.out[s.id]=r[i]); renderStage();
}

/* 📊 아주 많이 굴려 보기 */
let MANY={st:null,list:[]};
function renderMany(el){
  const st=S.st; if(MANY.st!==st) MANY={st,list:[]};
  const N=MANY.list.length, cnt=DC.counts(st,MANY.list);
  el.innerHTML=`<div class="sh">📊 아주 많이 굴려 보기</div>
    <div class="sd">${st===2?'두 주사위의 합':'주사위 한 개의 눈'}을 계속 굴려 쌓아 봐요. 많이 굴릴수록 막대 모양이 어떻게 되나요?</div>
    <div class="seg" style="max-width:640px;margin-bottom:12px">${[10,100,1000,10000].map(g=>`<button onclick="manyAdd(${g})">+${g}번</button>`).join('')}<button onclick="MANY.list=[];renderStage()">처음부터</button></div>
    <div style="font-size:22px;font-weight:900;margin-bottom:6px">지금까지 ${N.toLocaleString()}번</div>
    <div style="--bh:300px">${DC.boardHTML(st,null,cnt,{max:Math.max(1,Math.ceil(N*(st===2?6/36:1/6)*1.25)),theory:S.theory&&N?N:0})}</div>
    <div class="pct">${cnt.map(c=>`<div>${N?(c/N*100).toFixed(1)+'%':''}</div>`).join('')}</div>
    <div class="opts"><label><input type="checkbox" ${S.theory?'checked':''} onchange="S.theory=this.checked;save();renderStage()"> 이론값 점선 보기</label></div>`;
}
function manyAdd(g){ MANY.list=MANY.list.concat(DC.decode(MANY.st,DC.roll(MANY.st,g))); if(MANY.list.length>200000) MANY.list=MANY.list.slice(-200000); renderStage(); }

/* 🧮 합 표 */
let TSEL=null;
function renderTable(el){
  const h=v=>`<span style="font-style:italic">${v}</span>`;
  el.innerHTML=`<div class="sh">🧮 두 주사위 눈의 합</div><div class="sd">칸을 누르면 같은 합끼리 칠해져요. 합마다 칸이 몇 개인지 세어 보세요.</div>
    <table class="sumtab"><tr><th style="font-size:18px">A＼B</th>${[1,2,3,4,5,6].map(b=>`<th>${b}</th>`).join('')}</tr>
    ${[1,2,3,4,5,6].map(a=>`<tr><th>${a}</th>${[1,2,3,4,5,6].map(b=>`<td class="${TSEL===a+b?'hl':''}" onclick="TSEL=${a+b};renderStage()">${a+b}</td>`).join('')}</tr>`).join('')}</table>
    <div style="text-align:center;font-size:24px;font-weight:900;min-height:40px">${TSEL?`합이 ${TSEL}인 경우: ${6-Math.abs(TSEL-7)}가지 / 36가지`:''}</div>
    <div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px">${DC.outs(2).map(v=>`<button class="${TSEL===v?'acc':'ghost'} sm" onclick="TSEL=${v};renderStage()">${v}</button>`).join('')}<button class="ghost sm" onclick="TSEL=null;renderStage()">지우기</button></div>`;
}

/* 📒 기록 */
function renderRec(el){
  const ks=Object.keys(S.tot).sort((a,b)=>S.tot[b].s-S.tot[a].s);
  el.innerHTML=`<div class="sh">📒 기록</div><div class="sd">판 ${S.rounds.length}번 · 학생 ${ks.length}명 (누적 점수 순)</div>
    <table class="mx"><tr><th>순</th><th>이름</th><th>누적 점수</th><th>판 수</th><th>평균</th><th>1등</th></tr>
    ${ks.map((k,i)=>{ const t=S.tot[k]; return `<tr><td>${i+1}</td><td style="text-align:left;font-weight:700">${esc(t.name)}</td><td><b>${t.s}</b></td><td>${t.g}</td><td>${t.g?(t.s/t.g).toFixed(1):'-'}</td><td>${t.w}</td></tr>`; }).join('')}</table>
    <h4 style="margin:16px 0 6px">판별 결과</h4>
    <table class="mx"><tr><th>판</th><th>단계</th><th>횟수</th><th>실제로 나온 횟수</th><th>참여</th><th>1등 점수</th></tr>
    ${S.rounds.map((r,i)=>{ const c=DC.counts(r.st,DC.decode(r.st,r.rolls)), sc=Object.values(r.sc); return `<tr><td>${i+1}</td><td>${r.st}</td><td>${r.n}</td><td style="font-size:13px">${DC.outs(r.st).map((v,j)=>`${v}:${c[j]}`).join(' ')}</td><td>${sc.length}</td><td>${sc.length?Math.max(...sc):'-'}</td></tr>`; }).reverse().join('')}</table>`;
}
function exportCSV(){
  const rows=[['종류','판','단계','횟수','이름','점수(맞힘)','칩·칩','실제 횟수 / 상대']];
  Object.values(S.games).sort((a,b)=>a.t-b.t).forEach((g,i)=>{ const c=DC.counts(g.st,DC.decode(g.st,g.rolls).slice(0,g.n)).join(' ');
    rows.push(['대결',i+1,g.st,g.n,g.a.name,g.a.s,g.a.c.join(' '),'vs '+g.b.name+' ('+c+')']); rows.push(['대결',i+1,g.st,g.n,g.b.name,g.b.s,g.b.c.join(' '),'vs '+g.a.name+' ('+c+')']); });
  S.rounds.forEach((r,i)=>{ const c=DC.counts(r.st,DC.decode(r.st,r.rolls)).join(' '); for(const nm in r.sc) rows.push(['반 전체',i+1,r.st,r.n,nm,r.sc[nm],r.bets[nm].join(' '),c]); });
  const csv='﻿'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='주사위게임-기록.csv'; a.click();
}


/* ---------- 📽 수업 슬라이드 ----------
   기본 내용은 slides.js, 이 화면에서 고친 글은 S.slEdit 에 저장 (기존 PPT 모양: 검은 제목 띠 + 주황 제목) */
let SL={on:false,editing:false,applied:null};
function slides(){ const E=S.slEdit||{}; return (window.DEFAULT_SLIDES||[]).map(d=>Object.assign({},d,E[d.id]||{})); }
function openSlides(){
  SL.on=true; SL.applied=null; if(S.slide==null) S.slide=0;
  document.body.classList.add('slmode'); $('sl').classList.add('on');
  try{ document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){}
  renderSlide();
}
function closeSlides(){
  SL.on=false; SL.editing=false; $('sl').classList.remove('on'); document.body.classList.remove('slmode');
  $('stageHome').appendChild($('stage'));
  try{ document.fullscreenElement&&document.exitFullscreen(); }catch(e){}
  renderAll();
}
function goSlide(d){ const L=slides(); const i=Math.max(0,Math.min(L.length-1,(S.slide||0)+d)); if(i===S.slide) return; S.slide=i; save(); renderSlide(); }
function fitSlide(){ const f=$('slFrame'); if(!f) return; const k=Math.min(innerWidth/1600,(innerHeight-44)/900); f.style.transform=`scale(${k})`; f.style.left=((innerWidth-1600*k)/2)+'px'; f.style.top=Math.max(0,(innerHeight-44-900*k)/2)+'px'; }
addEventListener('resize',()=>{ if(SL.on) fitSlide(); });
function applySet(sd,i){
  if(SL.applied===i||!sd.set) return; SL.applied=i;
  const z=sd.set; let ch=false;
  if(S.ph!=='bet'){
    if(z.st&&S.st!==z.st){ S.st=z.st; if(!z.n) S.n=DC.nOpts(z.st)[1]; ch=true; }
    if(z.n&&S.n!==z.n){ S.n=z.n; ch=true; }
  }
  if(z.dn&&S.dn!==z.dn){ S.dn=z.dn; ch=true; }
  if(ch){ if(S.ph==='roll'){ S.ph='wait'; S.res=null; S.rolls=''; } save(); writeCfg(); }
}
const VIEW={chip:'game',sim:'sim',many:'many',duel:'duel',table:'table'};
function ed(f,html,tag){ return `<${tag||'div'} class="ed" data-f="${f}">${html||''}</${tag||'div'}>`; }
function renderSlide(){
  const L=slides(), i=Math.min(S.slide||0,L.length-1), sd=L[i];
  applySet(sd,i);
  $('stageHome').appendChild($('stage'));   // 슬라이드를 다시 그리기 전에 게임 화면을 제자리로
  const hd=`<div class="shd">${ed('title',sd.title,'div')}<div class="stag">${ed('tag',sd.tag||'','span')}</div></div>`;
  let h='';
  if(sd.kind==='title') h=`<div class="scover"><div class="dice">${[3,5,1,6,2,4].map(v=>DC.dieSVG(v,120)).join('')}</div><div class="ctext">${ed('kicker',sd.kicker)}${ed('title',sd.title)}${ed('sub',sd.sub)}</div></div>`;
  else if(sd.kind==='goal') h=hd+`<div class="sgoal"><div class="gl">지난 시간 목표</div>${ed('prev',sd.prev,'div')}<div class="gl">이번 시간 목표</div>${ed('now',sd.now,'div')}</div>`;
  else if(sd.kind==='join') h=hd+`<div class="sjoin"><div class="jl">${ed('body',sd.body)}</div><div class="jr"><div class="qr" id="slQR"></div><div class="jc">수업 코드 <b>${S.code}</b></div><div class="ju">${esc(studentURL())}</div></div></div>`;
  else if(sd.kind==='text') h=hd+`<div class="stext">${ed('body',sd.body)}</div>`;
  else if(sd.kind==='ask') h=hd+`<div class="sask"><div class="aq">${ed('q',sd.q)}</div>${sd.hint?`<div class="ah">${ed('hint',sd.hint)}</div>`:''}<div class="sctl" id="askCtl"></div><div class="ans" id="askBox"></div></div>`;
  else h=hd+`<div class="sprompt">${ed('prompt',sd.prompt)}</div>${sd.live==='chip'?`<div class="sctl" id="slCtl"></div>`:''}<div class="slive" id="slLive"></div>`;
  $('slFrame').innerHTML=h;
  $('slPage').textContent=`${i+1} / ${L.length}`;
  $('slEditBtn').classList.toggle('acc',SL.editing);
  /* 빈칸: 누르면 답 */
  $('slFrame').querySelectorAll('.blank').forEach(b=>b.onclick=()=>{ if(!SL.editing) b.classList.toggle('show'); });
  /* 글 고치기 */
  $('slFrame').querySelectorAll('.ed').forEach(el=>{ el.contentEditable=SL.editing?'true':'false';
    el.onblur=()=>{ if(!SL.editing) return; S.slEdit=S.slEdit||{}; const o=S.slEdit[sd.id]||(S.slEdit[sd.id]={}); o[el.dataset.f]=el.innerHTML; save(); }; });
  if(sd.kind==='join'&&window.QRCode){ try{ new QRCode($('slQR'),{text:studentURL(),width:300,height:300}); }catch(e){} }
  if(sd.kind!=='ask'&&S.ask&&S.ask.open){ S.ask.open=false; save(); writeCfg(); }   // 질문 장을 떠나면 질문 닫기
  if(sd.kind==='ask') renderAsk();
  if(sd.kind==='live'){ S.view=VIEW[sd.live]||'game'; $('slLive').appendChild($('stage')); renderAll(); renderSlCtl(); }
  else { $('stageHome').appendChild($('stage')); }
  fitSlide();
}
function curSlide(){ const L=slides(); return L[Math.min(S.slide||0,L.length-1)]; }
/* ❓ 생각 모으기: 학생이 패드에 쓴 답을 슬라이드에 모아 보여 줌 */
function renderAsk(){
  const c=$('askCtl'), b=$('askBox'); if(!c||!b) return;
  const sd=curSlide(), open=S.ask&&S.ask.open, id=S.ask&&S.ask.id;
  const ans=Object.values(LIVE).filter(x=>x.ans&&x.ans.id===id&&x.ans.t.trim());
  c.innerHTML=`<span class="st">${open?`학생 패드에 질문이 떠 있어요 · 답 ${ans.length}명`:'질문을 보내면 학생 패드에 쓰는 칸이 떠요'}</span>
    ${open?`<button class="ghost" onclick="S.ask.open=false;save();writeCfg();renderAsk()">질문 닫기</button>`:`<button class="acc" onclick="sendAsk()">❓ 학생에게 질문 보내기</button>`}
    <label style="font-size:18px"><input type="checkbox" ${S.hideNames?'checked':''} onchange="S.hideNames=this.checked;save();renderAsk()"> 이름 가리기</label>`;
  b.innerHTML=(open||ans.length)?ans.map(x=>`<div class="a"><div class="t">${esc(x.ans.t)}</div>${S.hideNames?'':`<div class="n">${esc(x.name)}</div>`}</div>`).join(''):'';
}
function sendAsk(){ const sd=curSlide(), q=(document.createElement('div')); q.innerHTML=sd.q||''; S.ask={id:Date.now(),q:q.textContent.trim().slice(0,200),open:true}; save(); writeCfg(); renderAsk(); }
function setPause(on){ S.paused=on; S.pauseMsg=$('pauseMsg').value.trim()||DEF.pauseMsg; save(); writeCfg(); renderSide(); slPauseBtns(); }
function slPauseBtns(){ const a=$('slPauseOn'), b=$('slPauseOff'); if(!a) return; a.classList.toggle('acc',!!S.paused); b.classList.toggle('on2',!S.paused); }
function renderSlCtl(){
  slPauseBtns(); if(curSlide().kind==='ask') renderAsk();
  const c=$('slCtl'); if(!c) return;
  const ns=curSlide().ns;
  const bets=Object.keys(betsNow()).length;
  c.innerHTML=`<span class="st">${DC.stageName(S.st)} · ${S.n}번 · ${S.ph==='wait'?'기다리는 중':S.ph==='bet'?`칩 놓는 중 (제출 ${bets}명)`:'결과'}</span>
    ${ns?ns.map(n=>`<button class="${S.n===n?'acc':'ghost'}" ${S.ph==='bet'?'disabled':''} onclick="setN(${n});renderSlCtl()">${n.toLocaleString()}번</button>`).join(''):''}
    <button onclick="openRound();renderSlCtl()" ${S.ph==='bet'?'disabled':''}>▶ 판 열기</button>
    <button class="acc" onclick="closeAndRoll();renderSlCtl()" ${S.ph!=='bet'?'disabled':''}>🎲 굴리기</button>
    <button class="ghost" onclick="toWait();renderSlCtl()" ${S.ph==='wait'?'disabled':''}>결과 닫기</button>`;
}
function toggleSlEdit(){ SL.editing=!SL.editing; renderSlide(); if(SL.editing) toast('글자를 눌러 고치세요. 다른 곳을 누르면 저장돼요',3500); }
function resetSlide(){ const sd=slides()[S.slide||0]; if(!confirm('이 슬라이드의 글을 처음 내용으로 되돌릴까요?')) return; if(S.slEdit) delete S.slEdit[sd.id]; save(); renderSlide(); }
addEventListener('keydown',e=>{
  if(!SL.on) return;
  const t=e.target; if(SL.editing&&t&&t.isContentEditable) return; if(t&&/INPUT|TEXTAREA|SELECT/.test(t.tagName)) return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); goSlide(1); }
  else if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); goSlide(-1); }
  else if(e.key==='Escape'&&!document.fullscreenElement) closeSlides();
});

document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{ S.view=b.dataset.v; save(); renderAll(); });
addEventListener('keydown',e=>{ if(e.key==='Escape'&&!SL.on) setProj(false); });
addEventListener('beforeunload',e=>{ if(Object.values(LIVE).some(x=>x.online)){ e.preventDefault(); e.returnValue=''; } });
showCode(); renderAll(); startFB();
</script>
</body>
