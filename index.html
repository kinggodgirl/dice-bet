<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주사위 동그라미 대결</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="dice-core.js"></script>
<style>
.wrap{max-width:1000px;margin:0 auto;padding:14px 16px 60px}
#home .box{max-width:460px;margin:36px auto 0}
h1{font-size:32px;font-weight:900;text-align:center;margin-bottom:2px}
.sub{text-align:center;color:var(--muted);margin-bottom:22px}
label.small{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
#home input{width:100%;font-size:20px}
#classCode{font-size:34px!important;text-align:center;letter-spacing:12px;font-weight:900}
#classState{margin-top:14px;font-size:15px;color:var(--muted);line-height:1.5;min-height:1.5em}
#classState.ok{color:var(--o);font-weight:700}
.solo{display:block;text-align:center;margin-top:28px;font-size:15px;color:var(--muted)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.top .ttl{font-weight:900;font-size:19px;flex:1;min-width:160px}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.pill .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#bbb;margin-right:6px}
.pill .dot.on{background:var(--o)}
.pill.tot{background:var(--ink);color:#fff;border-color:var(--ink)}
.phase-h{font-size:24px;font-weight:900;margin:2px 0 2px}
.phase-d{color:var(--muted);margin-bottom:12px}
.left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.left .big{font-size:26px;font-weight:900}
.left .big.full{color:var(--o)}
.left .sp{flex:1}
.left button{font-size:19px;padding:14px 22px}
.sent{background:var(--o-soft);border:2px solid var(--o);border-radius:12px;padding:10px 14px;font-weight:700;margin-top:10px}
.sent.warn{background:var(--t-soft);border-color:var(--t)}
.rollbox{display:flex;align-items:center;gap:16px;justify-content:center;min-height:96px;margin-bottom:6px}
.rollbox .cnt{font-size:20px;font-weight:900;color:var(--muted);min-width:110px}
.rollbox .sumv{font-size:40px;font-weight:900;font-family:"Times New Roman",serif}
.score{text-align:center;margin:12px 0 6px}
.score .n{font-size:54px;font-weight:900;color:var(--o);line-height:1.1}
.score .r{font-size:20px;font-weight:700}
.think{background:var(--acc-soft);border-radius:14px;padding:12px 16px;margin-top:12px;font-weight:700;line-height:1.7}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.mini .card{--bh:120px;margin:0}
.mini h4{font-size:15px;margin-bottom:4px}
.hist{width:100%;border-collapse:collapse;font-size:15px;background:#fff}
.hist td,.hist th{border-bottom:1px solid #eee7da;padding:6px;text-align:center}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cards button{flex:1;min-width:200px;background:#fff;color:var(--ink);border:2px solid var(--line);padding:14px}
.cards button.sel{border-color:var(--acc);background:var(--acc-soft)}
.lobby{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lobby .big{font-size:21px;padding:18px}
.joinrow{display:flex;gap:6px}.joinrow input{flex:1;min-width:0;font-size:24px;text-align:center;letter-spacing:6px;font-weight:900}
.rooms{display:flex;flex-direction:column;gap:8px}
.rooms button{display:flex;align-items:center;gap:14px;background:#fff;color:var(--ink);border:2px solid var(--line);text-align:left;font-size:18px}
.rooms .rn{font-size:24px;font-weight:900;color:var(--acc);letter-spacing:2px}.rooms .go{margin-left:auto;color:var(--acc)}
.ridbig{font-size:96px;font-weight:900;letter-spacing:16px;text-align:center;color:var(--acc);line-height:1.2}
.vs{font-weight:700;color:var(--muted);margin-bottom:4px}.okb{background:var(--o-soft);color:var(--o);border-radius:8px;padding:1px 8px;font-size:14px}
.score2{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:10px;margin-bottom:6px}
.score2>div{border:2px solid var(--line);border-radius:14px;padding:6px;font-weight:700}
.score2>div.t{border-color:var(--acc);background:var(--acc-soft)}
.score2 b{font-size:36px;color:var(--o)}
.score2 .kk{border:none;font-size:20px;color:var(--muted)}
.diebox{display:flex;align-items:center;justify-content:center;gap:12px;min-height:110px}
.diebox .sumv{font-size:44px;font-weight:900;font-family:"Times New Roman",serif}
.die.spin{transform:rotate(12deg)}
.rollbtn{font-size:26px;padding:18px 48px;border-radius:16px}
.wait{font-size:20px;font-weight:700;color:var(--muted);padding:16px}
.result{text-align:center;font-size:34px;font-weight:900;border-radius:16px;padding:12px;margin-bottom:12px}
.result span{display:block;font-size:26px}
.result.win{background:var(--o-soft);color:var(--o)}.result.lose{background:var(--x-soft);color:var(--x)}.result.draw{background:#eee;color:#555}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two h4{margin-bottom:4px}
.rollsum{margin-top:12px}
.result .pt{font-size:20px;margin-top:2px}
.betrow{background:var(--t-soft);border-radius:12px;padding:8px 12px;margin-bottom:10px}
.seg2{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.seg2 button{flex:1;min-width:56px;background:#fff;color:var(--ink);border:2px solid var(--line);font-size:18px;padding:9px}
.seg2 button.sel{background:#b8730a;border-color:#b8730a;color:#fff}
@media (max-width:700px){ .mini,.two,.lobby{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <!-- 첫 화면 -->
  <div id="home">
    <div class="box card">
      <h1>🎲 주사위 동그라미 대결</h1>
      <div class="sub">주사위를 여러 번 굴리면 무엇이 많이 나올까?</div>
      <label class="small">번호와 이름 (예: 7 김민준)</label>
      <input id="myName" maxlength="10" autocomplete="off">
      <label class="small">수업 코드 (선생님 화면의 숫자 4개)</label>
      <input id="classCode" maxlength="4" inputmode="numeric" autocomplete="off">
      <button class="acc" style="width:100%;margin-top:16px;font-size:20px;padding:15px" onclick="joinClick()">수업 들어가기</button>
      <div id="classState"></div>
    </div>
    <a class="solo" href="?solo=1">🤖 혼자 연습하기 (컴퓨터와 대결 · 수업 연결 없이)</a>
  </div>

  <!-- 게임 화면 -->
  <div id="main" class="hide">
    <div class="top">
      <div class="ttl" id="stageTtl">🎲 주사위 동그라미 대결</div>
      <span class="pill" id="who"></span>
      <span class="pill tot" id="totPill">누적 0점</span>
      <span class="pill"><span class="dot" id="connDot"></span><span id="connTxt">연결 중</span></span>
    </div>
    <div class="card" id="view"></div>
    <div class="card hide" id="histCard"><h4 style="margin-bottom:6px">📒 나의 기록</h4><div id="histBox"></div></div>
  </div>
</div>

<div class="overlay" id="pauseOv"><div class="box"><div style="font-size:44px">✋</div><div id="pauseMsg" style="font-size:24px;font-weight:900;margin-top:6px">선생님을 봐 주세요</div></div></div>
<div class="toast" id="toast"></div>

<script>
const APP_VER=20261125.1;   // teacher.html 과 같은 값이어야 함 (고칠 때마다 올리기)
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }};
const Q=new URLSearchParams(location.search);
const SOLO=Q.has('solo')||Q.has('demo');
let toastT; function toast(t,ms){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),ms||2600); }
document.head.insertAdjacentHTML('beforeend','<style>'+DC.css+'</style>');
const normName=s=>String(s||'').replace(/\s+/g,' ').trim().slice(0,10);
const nameOk=s=>/\d/.test(s)&&/[가-힣A-Za-z]/.test(s);
const myName=()=>normName($('myName').value);

/* ---------- 상태 ---------- */
let CFG={ph:'wait'};          // 선생님 화면이 정한 것
let MY={chips:null, r:null, sentSig:null, sent:null};   // 이번 판 내 칩
let OFFSET=0;                 // 서버 시계와 차이
let HIST=[];                  // 내 기록 [{r,st,n,s,rk,cnt}]
let animT=null, shownR=null;
const now=()=>Date.now()+OFFSET;
const histKey=()=>'dice-hist-'+(SOLO?'solo':(CL.code+'-'+myName()));

/* ---------- 화면 ---------- */
function setTop(){
  const inClass=CFG.ph==='bet'||CFG.ph==='roll', ds=ROOM&&ROOM.d?ROOM.d.st:duelSet().st;
  $('stageTtl').textContent=(inClass&&!ROOM?'🪙 ':'⚔ ')+DC.stageName(inClass&&!ROOM?CFG.st:ds);
  if(!SOLO&&!(inClass&&!ROOM)){ const R=rec(); $('totPill').textContent=(PT()?`💰 ${myBal()}점 · `:'')+`${R.w}승 ${R.l}패`; return; }
  const t=SOLO?HIST.reduce((s,h)=>s+h.s,0):((CFG.tot||{})[CL.key]||{}).s||0;
  $('totPill').textContent=SOLO?`최고 ${HIST.reduce((m,h)=>Math.max(m,h.s),0)}점`:`누적 ${t}점`;
}
let SOLOMODE='duel';   // 혼자 연습: 'duel'(컴퓨터와 대결) | 'chip'(칩 예측 연습)
function render(){
  setTop(); renderHist();
  if(ROOM){ stopAnim(); return renderRoom(); }
  if(SOLO&&SOLOMODE==='chip'){ if(CFG.ph==='wait') return renderSoloPick(); }
  if(CFG.ph==='bet') return renderBet();
  if(CFG.ph==='roll') return renderRoll();
  stopAnim();
  const v=$('ridIn')&&$('ridIn').value, f=document.activeElement&&document.activeElement.id==='ridIn';
  renderLobby();
  if(v&&$('ridIn')){ $('ridIn').value=v; if(f) $('ridIn').focus(); }
}
function chipsOk(){ return MY.chips && MY.chips.length===DC.outs(CFG.st).length; }
function renderBet(){
  stopAnim();
  const st=CFG.st, n=CFG.n;
  if(MY.r!==CFG.r||!chipsOk()){ MY.r=CFG.r; MY.chips=LS.get('dice-chips-'+st+'-'+n,null); if(!MY.chips||MY.chips.length!==DC.outs(st).length||DC.sum(MY.chips)>n) MY.chips=DC.outs(st).map(()=>0); MY.sentSig=null; MY.sent=null; }
  const what=st===2?'주사위 두 개를 함께 굴려 나온 두 눈의 합':'주사위 한 개를 굴려 나온 눈';
  $('view').innerHTML=`<div class="phase-h">🪙 칩 ${n}개를 놓으세요</div>
    <div class="phase-d">${what}을 <b>${n}번</b> 기록해요. 각 수가 <b>몇 번 나올지</b> 예상해서 칩을 놓으세요.<br>나중에 <b>실제로 나온 횟수와 겹친 칩</b>만큼 점수가 돼요. (막대를 누르거나 끌어도 돼요)</div>
    <div id="bwrap" style="--bh:${st===2?240:270}px"></div>
    <div class="left"><span class="big" id="leftTxt"></span><span class="sp"></span>
      <button class="ghost" onclick="clearChips()">모두 빼기</button>
      <button class="acc" id="sendBtn" onclick="sendBet()">제출하기</button></div>
    <div id="sentBox"></div>`;
  drawBoard(); updLeft();
}
function drawBoard(){
  const w=$('bwrap'); if(!w) return;
  w.innerHTML=DC.boardHTML(CFG.st,MY.chips,null,{edit:true,max:DC.editMax(CFG.n,MY.chips)});
  DC.bindBoard(w,()=>MY.chips,setChips,CFG.n);
}
function setChips(c,flag){
  if(CFG.ph!=='bet') return;
  MY.chips=c; LS.set('dice-chips-'+CFG.st+'-'+CFG.n,c);
  if(!DC.patchBoard($('bwrap'),c)) drawBoard();
  updLeft(); if(flag==='full') toast('칩을 다 놓았어요. 다른 곳에서 빼야 더 놓을 수 있어요',1800);
}
function clearChips(){ setChips(DC.outs(CFG.st).map(()=>0)); }
function updLeft(){
  const left=CFG.n-DC.sum(MY.chips), el=$('leftTxt'); if(!el) return;
  el.textContent=left?`남은 칩 ${left}개`:'✔ 칩을 다 놓았어요'; el.classList.toggle('full',!left);
  $('sendBtn').disabled=!!left;
  const sig=MY.chips.join(','), box=$('sentBox');
  if(SOLO){ $('sendBtn').textContent='🎲 굴리기'; box.innerHTML=''; return; }
  box.innerHTML = MY.sentSig==null ? '' : MY.sentSig===sig
    ? `<div class="sent">✔ 제출했어요. 선생님이 굴리기 전까지는 고쳐서 다시 제출할 수 있어요.</div>`
    : `<div class="sent warn">✏ 칩을 고쳤어요. [제출하기]를 다시 눌러야 바뀐 칩으로 겨뤄요.</div>`;
}
function sendBet(){
  if(DC.sum(MY.chips)!==CFG.n) return;
  if(SOLO) return soloRoll();
  const c=MY.chips.slice(), sig=c.join(','), r=CFG.r;
  me().child('bet').set({r, c, t:TS}).then(()=>{ if(CFG.r===r){ MY.sentSig=sig; MY.sent=c; updLeft(); toast('제출했어요'); } }).catch(e=>toast('제출 실패: '+e.message,4000));
}

/* 굴리기 보여 주기: 모두 같은 시각(서버 시간)에 맞춰 하나씩 */
function animDur(n){ return Math.min(9000, n*220); }
function stopAnim(){ cancelAnimationFrame(animT); animT=null; }
function renderRoll(){
  const st=CFG.st, n=CFG.n, list=DC.decode(st,CFG.rolls);
  const mine=MY.r===CFG.r&&MY.sent&&MY.sent.length===DC.outs(st).length?MY.sent:null;
  const res=CFG.res||{}, myS=res.sc?res.sc[CL.key]:(SOLO&&mine?DC.score(mine,DC.counts(st,list)):undefined);
  $('view').innerHTML=`<div class="phase-h" id="rollH">🎲 굴리는 중…</div>
    <div class="rollbox" id="rollBox"></div>
    <div id="bwrap" style="--bh:${st===2?220:250}px"></div>
    <div class="legend">${mine?'<span><i class="lc"></i>내 칩</span>':''}<span><i class="la"></i>실제로 나온 횟수</span>${mine?'<span><i class="lo"></i>겹친 칩 = 점수</span>':''}</div>
    <div id="after"></div>`;
  const dur=animDur(n), start=SOLO?CFG.at:(+CFG.at||0);
  let lastK=-1;
  const step=()=>{
    const t=now()-start, k=Math.max(0,Math.min(n, Math.floor(t/dur*n)+1));
    if(k!==lastK){ lastK=k;
      const part=list.slice(0,k), cnt=DC.counts(st,part), x=part[k-1];
      $('bwrap').innerHTML=DC.boardHTML(st,mine,cnt,{max:Math.max(Math.ceil(n/(st===2?4:3)),...(mine||[0]))});
      $('rollBox').innerHTML = x ? (st===2?`${DC.dieSVG(x.a,80)}${DC.dieSVG(x.b,80)}<span class="sumv">= ${x.v}</span>`:DC.dieSVG(x.a,90))+`<span class="cnt">${k} / ${n}번째</span>`:'';
      if(k>=n){ finish(mine,cnt,myS); return; }
    }
    animT=requestAnimationFrame(step);
  };
  stopAnim();
  step();
}
function finish(mine,cnt,myS){
  stopAnim();
  const st=CFG.st, res=CFG.res||{};
  $('rollH').textContent='🎲 결과';
  let h='';
  if(mine&&myS!=null){
    const rk=res.rk&&res.rk[CL.key];
    h+=`<div class="score"><div class="muted">내 점수 (겹친 칩)</div><div class="n">${myS}점</div>${rk?`<div class="r">반에서 ${rk}등 <span class="muted">/ ${res.cnt}명</span></div>`:''}</div>`;
  } else if(!SOLO) h+=`<div class="sent warn" style="text-align:center">이번 판에는 칩을 제출하지 않았어요.</div>`;
  if(!SOLO&&res.top&&res.top.length){
    h+=`<div class="mini"><div class="card"><h4>🥇 이번 판 1등의 칩 (${res.best}점)</h4>${DC.boardHTML(st,res.top[0],null,{max:Math.ceil(CFG.n/3)})}</div>
      ${mine?`<div class="card"><h4>🙋 내 칩 (${myS}점)</h4>${DC.boardHTML(st,mine,null,{max:Math.ceil(CFG.n/3)})}</div>`:''}</div>`;
  }
  h+=`<div class="card" style="margin-top:12px"><h4>🎲 굴린 주사위 전체 (${CFG.n}번)</h4>${DC.allDiceHTML(st,DC.decode(st,CFG.rolls))}</div>`;
  h+=`<div class="think">🤔 ${st===2?'어떤 합이 많이 나왔나요? 그 합이 왜 많이 나올까요? 두 주사위의 눈을 짝지어 생각해 보세요.':'점수를 많이 받으려면 칩을 어떻게 놓는 게 좋을까요? 1등의 칩 모양과 내 칩 모양을 비교해 보세요.'}</div>`;
  if(SOLO) h+=`<div style="text-align:center;margin-top:14px"><button class="acc" style="font-size:19px;padding:14px 26px" onclick="soloAgain()">다시 하기</button> <button class="ghost" onclick="CFG={ph:'wait'};render()">처음으로</button></div>`;
  $('after').innerHTML=h;
  if(mine&&myS!=null&&shownR!==CFG.r){ shownR=CFG.r;
    HIST=HIST.filter(x=>x.r!==CFG.r); HIST.unshift({r:CFG.r,st,n:CFG.n,s:myS,rk:res.rk?res.rk[CL.key]:null,cnt:res.cnt||null}); HIST=HIST.slice(0,40); LS.set(histKey(),HIST); renderHist(); setTop(); }
}
function renderHist(){
  if(!HIST.length){ $('histCard').classList.add('hide'); return; }
  $('histCard').classList.remove('hide');
  $('histBox').innerHTML=`<table class="hist"><tr><th>판</th><th>단계</th><th>칩</th><th>점수</th>${SOLO?'':'<th>등수</th>'}</tr>${HIST.slice(0,12).map((h,i)=>`<tr><td>${HIST.length-i}</td><td>${h.st}단계</td><td>${h.n}개</td><td><b>${h.s}</b></td>${SOLO?'':`<td>${h.rk?h.rk+'등 / '+h.cnt+'명':'-'}</td>`}</tr>`).join('')}</table>`;
}

/* ---------- 혼자 연습 ---------- */
let soloSt=1, soloN=30;
function renderSoloPick(){
  stopAnim();
  $('view').innerHTML=`<div class="phase-h">🤖 혼자 연습하기</div><div class="phase-d">칩을 놓고 컴퓨터가 주사위를 굴려요. 점수를 가장 높게 받는 방법을 찾아보세요.</div>
    <div class="cards">${[1,2].map(s=>`<button class="${s===soloSt?'sel':''}" onclick="soloSt=${s};soloN=DC.nOpts(${s})[0];renderSoloPick()"><b>${DC.stageName(s)}</b></button>`).join('')}</div>
    <div class="cards">${DC.nOpts(soloSt).map(n=>`<button class="${n===soloN?'sel':''}" onclick="soloN=${n};renderSoloPick()">${n}번 굴리기 · 칩 ${n}개</button>`).join('')}</div>
    <button class="acc" style="width:100%;font-size:20px;padding:15px" onclick="soloAgain()">시작</button>
    <button class="ghost" style="width:100%;margin-top:8px" onclick="SOLOMODE='duel';render()">← 컴퓨터와 대결로</button>`;
}
function soloAgain(){ CFG={ph:'bet',st:soloSt,n:soloN,r:'s'+Date.now()}; MY.r=null; render(); }
function soloRoll(){ MY.sentSig=MY.chips.join(','); MY.sent=MY.chips.slice(); CFG=Object.assign({},CFG,{ph:'roll',rolls:DC.roll(CFG.st,CFG.n),at:now()}); render(); }

/* ---------- 1:1 동그라미 대결 ----------
   dice/{코드}/rooms/{방번호} = {st, n, g(몇 번째 판), a:{uid,name,key,on,c,rd}, b:{…}, rolls:'굴린 결과', t}
   a 가 방을 만든 사람. 굴리는 차례: 굴린 횟수가 짝수면 a, 홀수면 b.
------------------------------------------------------------ */
let ROOM=null;              // {rid, slot, d(방 데이터), bot}
let ROOMS={};               // 수업의 모든 방 (기다리는 방 목록용)
let SHOWN=0, rollAnimT=null, rolling=false;
let DRAFT=null;             // 내가 놓는 중인 동그라미
const other=s=>s==='a'?'b':'a';
const step=st=>st===2?2:1;
function duelSet(){ return SOLO?{st:soloSt,n:DC.duelN(soloSt)[0]}:{st:+CFG.dst||1,n:+CFG.dn||DC.duelN(+CFG.dst||1)[0]}; }
/* 포인트 (교사가 켜면 cfg.pt = {start,max,streak}, 잔액은 cfg.bal, 연속 상대는 cfg.pair) */
let DRAFTBET=null;
function PT(){ return !SOLO&&CFG.pt&&CFG.pt.on?CFG.pt:null; }
function myBal(){ const p=PT(); if(!p) return 0; const b=(CFG.bal||{})[CL.key]; return b==null?p.start:b; }
function blockedWith(opKey){ const p=PT(), x=(CFG.pair||{})[CL.key]; return !!(p&&x&&x.op===opKey&&x.n>=p.streak); }
function stakeOf(d){ const p=PT(); if(!p||ROOM.bot||!d.a||!d.b) return 0; const op=d[other(ROOM.slot)]; if(blockedWith(op.key)) return 0; return Math.max(0,Math.min(+d.a.bet||0,+d.b.bet||0,p.max)); }
function rec(){ return ((CFG.rec||{})[CL.key])||{w:0,l:0,d:0}; }

function renderLobby(){
  const {st,n}=duelSet();
  const open=Object.entries(ROOMS).filter(([rid,r])=>r&&r.a&&!r.b&&r.a.on&&r.st===st&&r.n===n&&r.a.key!==CL.key).sort((x,y)=>(y[1].t||0)-(x[1].t||0));
  const R=rec();
  $('view').innerHTML=`<div class="phase-h">⚔ 1:1 동그라미 대결</div>
    <div class="phase-d"><b>${DC.stageName(st)}</b> · 동그라미 <b>${n}개</b>를 표에 놓고, 둘이 번갈아 <b>${n}번</b> 굴려요.<br>${st===2?'두 주사위 눈의 합':'나온 눈'}에 내 동그라미가 있으면 ✔ 맞힘! 더 많이 맞힌 사람이 이겨요.</div>
    ${SOLO?`<div class="cards">${[1,2].map(s=>`<button class="${s===soloSt?'sel':''}" onclick="soloSt=${s};render()"><b>${DC.stageName(s)}</b></button>`).join('')}</div>`:''}
    ${SOLO?'':`<div class="lobby">
      <button class="acc big" onclick="createRoom()">＋ 방 만들기</button>
      <div class="joinrow"><input id="ridIn" maxlength="3" inputmode="numeric" placeholder="방 번호"><button onclick="joinRoom($('ridIn').value)">들어가기</button></div>
    </div>
    <h4 style="margin:14px 0 6px">🚪 친구가 기다리는 방</h4>
    <div class="rooms">${open.length?open.map(([rid,r])=>`<button onclick="joinRoom('${rid}')"><span class="rn">${rid}</span><span>${esc(r.a.name)}</span><span class="go">들어가기 ▶</span></button>`).join(''):'<div class="muted">아직 없어요. 방을 만들거나 친구에게 방 번호를 물어보세요.</div>'}</div>`}
    <button class="${SOLO?'acc':'ghost'}" style="width:100%;margin-top:16px;${SOLO?'font-size:20px;padding:15px':''}" onclick="botRoom()">🤖 컴퓨터와 대결하기</button>
    ${SOLO?`<button class="ghost" style="width:100%;margin-top:8px" onclick="SOLOMODE='chip';CFG={ph:'wait'};render()">🪙 칩 예측 혼자 연습</button>`:''}
    ${SOLO?'':`<div class="muted" style="margin-top:10px;text-align:center">내 전적: ${R.w}승 ${R.l}패 ${R.d}무 <span style="font-size:13px">(컴퓨터와 한 대결은 빼고)</span></div>`}`;
}
function newRoomData(st,n,me){ return {st,n,g:1,a:me,rolls:'',t:SOLO?Date.now():TS}; }
function myInfo(){ return {uid:CL.uid||'me',name:SOLO?'나':myName(),key:CL.key||'me',on:true}; }
function createRoom(tries=0){
  const {st,n}=duelSet(), rid=String(100+Math.floor(Math.random()*900));
  const ref=CL.base.child('rooms/'+rid);
  ref.once('value').then(s=>{
    if(s.exists()&&tries<8) return createRoom(tries+1);
    return ref.set(newRoomData(st,n,myInfo())).then(()=>enterRoom(rid,'a'));
  }).catch(e=>toast('방을 만들지 못했어요: '+e.message,4000));
}
function joinRoom(rid){
  rid=String(rid||'').replace(/\D/g,''); if(rid.length!==3){ toast('방 번호 3자리를 넣으세요'); return; }
  const ref=CL.base.child('rooms/'+rid);
  ref.once('value').then(s=>{
    const r=s.val();
    if(!r||!r.a){ toast('그런 방이 없어요'); return; }
    if(r.a.key===CL.key){ return enterRoom(rid,'a'); }
    if(r.b&&r.b.key===CL.key){ return enterRoom(rid,'b'); }
    if(r.b){ toast('이미 두 명이 들어간 방이에요'); return; }
    return ref.child('b').set(myInfo()).then(()=>enterRoom(rid,'b'));
  }).catch(e=>toast(isDenied(e)?'방에 들어가지 못했어요 (이미 다른 친구가 들어갔어요)':'오류: '+e.message,4000));
}
function enterRoom(rid,slot){
  const ref=CL.base.child('rooms/'+rid);
  ROOM={rid,slot,d:null,bot:false}; SHOWN=-1; DRAFT=null;
  ref.child(slot).onDisconnect().update({on:false});
  ref.child(slot).update({on:true});
  ref.on('value',s=>{ if(!ROOM||ROOM.rid!==rid||ROOM.bot) return; const d=s.val();
    if(!d){ ROOM=null; toast('방이 없어졌어요'); render(); return; }
    onRoom(d); });
  LS.set('dice-room',{code:CL.code,rid,slot});
}
function leaveRoom(){
  if(!ROOM) return;
  if(!ROOM.bot&&CL.base){ const ref=CL.base.child('rooms/'+ROOM.rid), d=ROOM.d||{};
    ref.off(); ref.child(ROOM.slot).onDisconnect().cancel().catch(()=>{});
    const op=d[other(ROOM.slot)];
    if(!d.b||(op&&op.on===false)) ref.remove().catch(()=>{}); else ref.child(ROOM.slot).update({on:false}).catch(()=>{}); }
  clearTimeout(rollAnimT); clearTimeout(botT); ROOM=null; rolling=false; LS.set('dice-room',null); render();
}
/* 방 데이터가 바뀜 → 새로 굴린 게 있으면 굴리는 모습을 먼저 보여 줌 */
function onRoom(d){
  const prevG=ROOM.d&&ROOM.d.g; ROOM.d=d;
  if(prevG!==d.g){ SHOWN=-1; DRAFT=null; DRAFTBET=null; }
  const cnt=Math.floor(String(d.rolls||'').length/step(d.st));
  if(SHOWN<0||cnt<SHOWN){ SHOWN=cnt; return renderRoom(); }   // 처음 들어옴 / 새 판
  if(cnt>SHOWN&&!rolling) return animRoll();
  if(!rolling) renderRoom();
}
function animRoll(){
  const d=ROOM.d, st=d.st, list=DC.decode(st,d.rolls), x=list[SHOWN];
  rolling=true; renderRoom();
  let i=0; const box=$('dieBox');
  const spin=()=>{ if(!ROOM){ rolling=false; return; } i++;
    const a=1+Math.floor(Math.random()*6), b=1+Math.floor(Math.random()*6);
    if(box) box.innerHTML=st===2?DC.dieSVG(a,84,'spin')+DC.dieSVG(b,84,'spin'):DC.dieSVG(a,96,'spin');
    if(i<8) rollAnimT=setTimeout(spin,80);
    else { SHOWN++; rolling=false; LAST=x; renderRoom(); const c2=Math.floor(String(ROOM.d.rolls||'').length/step(st)); if(c2>SHOWN) setTimeout(animRoll,350); else botTurn(); }
  };
  spin();
}
let LAST=null;
function renderRoom(){
  const d=ROOM.d; if(!d) { $('view').innerHTML='<div class="muted">방에 들어가는 중…</div>'; return; }
  const st=d.st, n=d.n, R=DC.rows(st,n), me=d[ROOM.slot]||{}, op=d[other(ROOM.slot)]||null;
  const list=DC.decode(st,d.rolls).slice(0,Math.max(0,SHOWN)), k=list.length;
  const opName=op?esc(op.name):'';
  setTop();
  /* ① 상대 기다리기 */
  if(!op){
    $('view').innerHTML=`<div class="phase-h">🚪 방 번호</div><div class="ridbig">${ROOM.rid}</div>
      <div class="phase-d" style="text-align:center">친구에게 방 번호를 알려 주세요. 친구가 들어오면 바로 시작해요.</div>
      <div style="text-align:center"><button class="ghost" onclick="leaveRoom()">방 닫기</button></div>`; return;
  }
  /* ② 동그라미 놓기 */
  if(!me.rd){
    if(!DRAFT||DRAFT.length!==DC.outs(st).length) DRAFT=DC.outs(st).map(()=>0);
    const left=n-DC.sum(DRAFT);
    $('view').innerHTML=`<div class="vs">나 <b>vs</b> ${opName}${op.rd?' <span class="okb">놓기 끝</span>':''}</div>
      <div class="phase-h">⭕ 동그라미 ${n}개를 놓으세요</div>
      <div class="phase-d">${st===2?'두 주사위 눈의 합':'주사위 눈'}이 몇 번 나올지 생각해서 칸을 눌러 동그라미를 놓아요. 다시 누르면 빠져요.</div>
      ${betRow(op)}
      <div id="tabw">${DC.tableHTML(st,R,DRAFT,null,{edit:true})}</div>
      <div class="left"><span class="big ${left?'':'full'}">${left?`남은 동그라미 ${left}개`:'✔ 다 놓았어요'}</span><span class="sp"></span>
        <button class="ghost" onclick="DRAFT=null;renderRoom()">모두 지우기</button>
        <button class="acc" ${left?'disabled':''} onclick="placeDone()">놓기 끝 ▶</button></div>
      <div style="text-align:right;margin-top:10px"><button class="ghost sm" onclick="if(confirm('방에서 나갈까요?'))leaveRoom()">나가기</button></div>`;
    $('tabw').querySelectorAll('.dcell').forEach(el=>el.onclick=()=>{
      const i=+el.dataset.i, r=+el.dataset.r;
      if(r<DRAFT[i]) DRAFT[i]--; else if(DC.sum(DRAFT)>=n) return toast('동그라미를 다 놓았어요. 다른 칸에서 빼야 더 놓을 수 있어요',1800); else if(DRAFT[i]<R) DRAFT[i]++;
      renderRoom(); });
    return;
  }
  const myHit=DC.hits(st,me.c||[],list), opHit=op.c?DC.hits(st,op.c,list):null;
  const ms=DC.sum(myHit), os=opHit?DC.sum(opHit):0;
  const lastI=LAST&&k?DC.outs(st).indexOf(list[k-1].v):null;
  /* ③ 상대가 아직 놓는 중 */
  if(!op.rd){
    $('view').innerHTML=`<div class="vs">나 <b>vs</b> ${opName}</div><div class="phase-h">⏳ ${opName}이(가) 동그라미를 놓는 중이에요</div>
      <div id="tabw">${DC.tableHTML(st,R,me.c,null,{})}</div>`; return;
  }
  /* ④ 끝 */
  if(k>=n&&!rolling){
    const res=ms>os?'win':ms<os?'lose':'draw';
    $('view').innerHTML=`<div class="result ${res}">${res==='win'?'🎉 이겼어요!':res==='lose'?'😢 졌어요':'🤝 비겼어요'} <span>${ms} : ${os}</span>${PT()&&!ROOM.bot?`<span class="pt">💰 ${!(d.stake&&d.stake.g===d.g)?'정산하는 중…':d.stake.v&&res!=='draw'?(res==='win'?'+':'−')+d.stake.v+'점':'포인트 변화 없음'}</span>`:''}</div>
      <div class="two"><div><h4>🙋 나 · 맞힘 ${ms}개</h4>${DC.tableHTML(st,R,me.c,myHit,{small:st===2})}</div>
        <div><h4>${ROOM.bot?'🤖 ':''}${opName} · 맞힘 ${os}개${ROOM.bot&&ROOM.botName?` <span class="muted">(${esc(ROOM.botName)})</span>`:''}</h4>${DC.tableHTML(st,R,op.c,opHit,{small:st===2})}</div></div>
      <div class="rollsum"><b>실제로 나온 횟수</b><div style="--bh:90px">${DC.boardHTML(st,null,DC.counts(st,list),{max:Math.max(3,...DC.counts(st,list))})}</div></div>
      <div class="think">🤔 ${st===2?'많이 나온 합은 무엇인가요? 그 합에 동그라미를 많이 놓은 사람이 유리했나요? 왜 그 합이 많이 나올까요?':'두 사람의 동그라미 모양을 비교해 보세요. 한 칸에 많이 몰아 놓으면 어떻게 될까요?'}</div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:14px"><button class="acc" style="font-size:19px;padding:14px 26px" onclick="rematch()">🔁 다시 하기</button><button class="ghost" onclick="leaveRoom()">나가기</button></div>`;
    return;
  }
  /* ⑤ 굴리기 */
  const turn=k%2===0?'a':'b', mine=turn===ROOM.slot&&!rolling;
  const x=k?list[k-1]:null;
  $('view').innerHTML=`<div class="score2"><div class="${turn===ROOM.slot?'t':''}">🙋 나<br><b>${ms}</b></div><div class="kk">${k} / ${n}번${PT()&&!ROOM.bot?`<br><span style="font-size:15px">💰 ${stakeOf(d)}점</span>`:''}</div><div class="${turn!==ROOM.slot?'t':''}">${ROOM.bot?'🤖 ':''}${opName}<br><b>${os}</b></div></div>
    <div class="diebox" id="dieBox">${x?(st===2?DC.dieSVG(x.a,84)+DC.dieSVG(x.b,84)+`<span class="sumv">= ${x.v}</span>`:DC.dieSVG(x.a,96)):'<span class="muted">처음 굴리기를 기다려요</span>'}</div>
    <div style="text-align:center;margin-bottom:12px">${mine?`<button class="acc rollbtn" onclick="doRoll()">🎲 굴리기</button>`:`<div class="wait">${rolling?'굴리는 중…':`${opName}의 차례예요`}</div>`}</div>
    <div id="tabw">${DC.tableHTML(st,R,me.c,myHit,{last:lastI})}</div>
    ${op.on===false&&!ROOM.bot?`<div class="sent warn" style="margin-top:10px">${opName}의 연결이 끊겼어요. 기다리거나 <button class="sm ghost" onclick="leaveRoom()">나가기</button></div>`:''}`;
}
function betRow(op){
  const p=PT(); if(!p||ROOM.bot) return '';
  if(blockedWith(op.key)) return `<div class="sent warn" style="margin-bottom:10px">💰 ${esc(op.name)}와(과) 연속 ${p.streak}판을 했어요. 이번 판은 포인트가 걸리지 않아요. 다른 친구와도 겨뤄 보세요!</div>`;
  const cap=Math.min(p.max,myBal()), opts=[...new Set([0,5,10,20,30,50,p.max].filter(x=>x<=cap))].sort((a,b)=>a-b);
  if(DRAFTBET==null||DRAFTBET>cap) DRAFTBET=Math.min(10,cap);
  return `<div class="betrow"><b>💰 걸 점수</b> <span class="muted">(내 포인트 ${myBal()}점 · 둘 중 작은 점수로 겨뤄요)</span>
    <div class="seg2">${opts.map(x=>`<button class="${x===DRAFTBET?'sel':''}" onclick="DRAFTBET=${x};renderRoom()">${x}</button>`).join('')}</div></div>`;
}
function placeDone(){
  const d=ROOM.d; if(DC.sum(DRAFT)!==d.n) return;
  const c=DRAFT.slice();
  if(ROOM.bot){ d.a.c=c; d.a.rd=true; onRoom(d); return; }
  CL.base.child('rooms/'+ROOM.rid+'/'+ROOM.slot).update({c,rd:true,bet:PT()&&DRAFTBET!=null?DRAFTBET:0}).catch(e=>toast('저장 실패: '+e.message,4000));
}
function doRoll(){
  const d=ROOM.d, st=d.st, k=Math.floor(String(d.rolls||'').length/step(st));
  if(rolling||k>=d.n||(k%2===0?'a':'b')!==ROOM.slot) return;
  const nr=String(d.rolls||'')+DC.roll(st,1);
  if(ROOM.bot){ d.rolls=nr; onRoom(d); return; }
  CL.base.child('rooms/'+ROOM.rid+'/rolls').set(nr).catch(e=>toast('굴리기 실패: '+e.message,4000));
}
function rematch(){
  const d=ROOM.d;
  if(ROOM.bot){ const p=DC.botPlan(d.st,d.n); ROOM.botName=p.name; const nd={st:d.st,n:d.n,g:d.g+1,a:{name:'나',on:true},b:{name:'컴퓨터',on:true,c:p.c,rd:true},rolls:''}; onRoom(nd); return; }
  const u={g:(d.g||1)+1, rolls:'', 'a/c':null,'a/rd':null,'a/bet':null,'b/c':null,'b/rd':null,'b/bet':null};
  CL.base.child('rooms/'+ROOM.rid).update(u).catch(e=>toast('실패: '+e.message,4000));
}
/* 🤖 컴퓨터 상대 (이 기기 안에서만) */
let botT=null;
function botRoom(){
  const {st,n}=duelSet(), p=DC.botPlan(st,n);
  ROOM={rid:'🤖',slot:'a',bot:true,botName:p.name,d:null}; SHOWN=-1; DRAFT=null;
  onRoom({st,n,g:1,a:{name:'나',on:true},b:{name:'컴퓨터',on:true,c:p.c,rd:true},rolls:''});
}
function botTurn(){
  if(!ROOM||!ROOM.bot) return; const d=ROOM.d, k=Math.floor(d.rolls.length/step(d.st));
  if(!d.a.rd||k>=d.n||k%2===0) return;
  clearTimeout(botT); botT=setTimeout(()=>{ if(!ROOM||!ROOM.bot||ROOM.d!==d) return; d.rolls+=DC.roll(d.st,1); onRoom(d); },900);
}

/* ---------- 수업 연결 (Firebase Realtime Database) ----------
   dice/{코드}/cfg            ← 선생님이 씀: 단계, 판 번호, 굴린 결과, 점수, 멈춤
   dice/{코드}/stu/{이름}/bet  ← 내 칩 (내가 씀)
   dice/{코드}/stu/{이름}/p    ← 접속 표시 (내가 씀)
------------------------------------------------------------ */
const FB_OK=!SOLO&&!!(window.firebase && window.FB_CONFIG && FB_CONFIG.apiKey && FB_CONFIG.databaseURL);
let db=null; if(FB_OK){ try{ firebase.initializeApp(FB_CONFIG); db=firebase.database(); }catch(e){ console.error(e); } }
const TS=FB_OK?firebase.database.ServerValue.TIMESTAMP:0;
const CL={code:null,key:null,base:null,connected:false};
let deviceId; try{ deviceId=sessionStorage.getItem('dice-tab'); if(!deviceId){ deviceId=Math.random().toString(36).slice(2,12); sessionStorage.setItem('dice-tab',deviceId);} }catch(e){ deviceId=Math.random().toString(36).slice(2,12); }
const fbKey=n=>encodeURIComponent(n).replace(/\./g,'%2E');
function setState(t,ok){ const el=$('classState'); el.textContent=t; el.classList.toggle('ok',!!ok); }
function me(){ return CL.base.child('stu/'+CL.key); }
function applyCfg(c){
  if(!c) return;
  const prev=CFG; CFG=c;
  $('pauseOv').classList.toggle('on',!!c.paused); if(c.pauseMsg) $('pauseMsg').textContent=c.pauseMsg;
  const v=+c.ver||0; if(v&&v!==APP_VER&&CL.verWarn!==v){ CL.verWarn=v; toast(v>APP_VER?'⚠ 새 버전이 있어요. 이 화면을 새로고침해 주세요.':'⚠ 선생님 화면이 옛 버전이에요. 선생님께 새로고침을 부탁하세요.',6000); }
  if(c.resetAt && c.resetAt>LS.get(histKey()+'-reset',0)){ LS.set(histKey()+'-reset',c.resetAt); HIST=[]; LS.set(histKey(),HIST); }
  /* 같은 판·같은 단계에서 점수표만 바뀐 경우엔 다시 그리지 않음 */
  if(ROOM){ setTop(); if(!rolling&&ROOM.d&&!ROOM.bot) renderRoom(); return; }   // 대결 중에는 대결 화면 그대로
  if(prev.ph===c.ph&&prev.r===c.r&&prev.rolls===c.rolls&&JSON.stringify(prev.res)===JSON.stringify(c.res)&&(c.ph!=='wait'||(prev.dst===c.dst&&prev.dn===c.dn&&JSON.stringify(prev.rec)===JSON.stringify(c.rec)&&JSON.stringify(prev.pt)===JSON.stringify(c.pt)))){ setTop(); return; }
  render();
}
function joinClick(){
  const code=$('classCode').value.replace(/\D/g,''), nm=myName();
  if(!nm){ setState('먼저 번호와 이름을 입력하세요.'); $('myName').focus(); return; }
  if(!nameOk(nm)){ setState('번호와 이름을 함께 써 주세요. (예: 7 김민준)'); $('myName').focus(); return; }
  $('myName').value=nm;
  if(code.length!==4){ setState('수업 코드 4자리를 입력하세요.'); return; }
  LS.set('dice-name',nm); LS.set('dice-class',code);
  connect(code);
}
function showMain(){ $('home').classList.add('hide'); $('main').classList.remove('hide'); $('who').textContent='👤 '+(SOLO?'연습':myName()); HIST=LS.get(histKey(),[]); render(); }
function goHome(){ leaveRoom(); disconnect(); stopAnim(); $('pauseOv').classList.remove('on'); $('main').classList.add('hide'); $('home').classList.remove('hide'); setState(''); }
function setConn(on){ CL.connected=on; $('connDot').classList.toggle('on',on); $('connTxt').textContent=on?'연결됨':'연결 끊김 · 다시 연결하는 중'; }
function disconnect(){
  clearTimeout(CL.joinT);
  if(CL.base){ try{ me().child('uid').off(); me().child('p').update({online:false}).catch(()=>{}); me().child('p').onDisconnect().cancel().catch(()=>{}); }catch(e){} try{ CL.base.child('cfg').off(); CL.base.child('rooms').off(); }catch(e){} }
  try{ db&&db.ref('.info/connected').off(); }catch(e){}
  CL.base=null; CL.code=null; setConn(false);
}
function connect(code){
  if(!FB_OK||!db){ setState('⚠ 연결 설정(firebase-config.js)이 아직 없어요. 선생님께 알려 주세요.'); return; }
  disconnect(); CL.code=code; setState('수업을 찾는 중…');
  const base=db.ref('dice/'+code), my=code;
  CL.joinT=setTimeout(()=>{ if(CL.code===my&&!CL.base) setState('⏳ 서버 응답이 늦어요. 와이파이를 확인하세요. 계속 기다리는 중…'); },10000);
  let cfgSnap=null;
  authReady().then(uid=>(CL.uid=uid, base.child('cfg').once('value').then(snap=>{
    if(CL.code!==my) return;
    if(!snap.exists()){ clearTimeout(CL.joinT); CL.code=null; setState(`수업 ${code}을(를) 찾지 못했어요. 선생님 화면이 열려 있는지, 코드가 맞는지 확인하세요.`); return; }
    cfgSnap=snap; CL.key=fbKey(myName()); CL.base=base;
    return me().child('uid').set(uid).then(()=>me().child('bet').once('value')).catch(e=>{
      if(CL.code!==my) return;
      const err=new Error(isDenied(e)?`'${myName()}' 이름은 다른 기기에서 이미 쓰고 있어요. 번호와 이름이 맞는지 확인하세요. 기기를 바꿨다면 선생님께 [🔓 기기 바꾸기]를 부탁하세요.`:'연결 오류: '+e.message);
      err.ui=true; throw err;
    });
  }))).then(bs=>{
    if(CL.code!==my||!cfgSnap||!bs) return;
    clearTimeout(CL.joinT);
    const b=bs.val(), c=cfgSnap.val()||{};
    if(b&&b.r===c.r&&DC.validChips(c.st,c.n,b.c)){ MY={chips:b.c.slice(),r:c.r,sentSig:b.c.join(','),sent:b.c}; }   // 새로고침해도 제출한 칩 그대로
    showMain(); applyCfg(c);
    db.ref('.info/connected').on('value',s=>{ const on=!!s.val(); if(on&&CL.base===base){ const p=me().child('p'); p.onDisconnect().update({online:false}); p.update({online:true,name:myName(),dev:deviceId,ver:APP_VER,t:TS}); } setConn(on); });
    db.ref('.info/serverTimeOffset').on('value',s=>{ OFFSET=+s.val()||0; });
    base.child('cfg').on('value',s=>applyCfg(s.val()));
    me().child('uid').on('value',s=>{ if(CL.base===base && s.val()!==CL.uid) kicked(); }, ()=>{ if(CL.base===base) kicked(); });
    base.child('rooms').on('value',s=>{ ROOMS=s.val()||{}; if(!ROOM&&CFG.ph!=='bet'&&CFG.ph!=='roll') render(); }, ()=>{});
    const lr=LS.get('dice-room',null);   // 새로고침 전에 있던 방으로
    if(lr&&lr.code===code){ base.child('rooms/'+lr.rid).once('value').then(s=>{ const r=s.val(); if(r&&r[lr.slot]&&r[lr.slot].key===CL.key&&!ROOM) enterRoom(lr.rid,lr.slot); }).catch(()=>{}); }
    setState(`✔ 수업 ${code}에 연결됨`,true);
  }).catch(e=>{ if(CL.code!==my) return; clearTimeout(CL.joinT); CL.code=null; CL.base=null; setState('❌ '+(e.ui?e.message:authMsg(e))); });
}
let authP=null;
function authReady(){
  if(!authP) authP=new Promise((res,rej)=>{
    const un=firebase.auth().onAuthStateChanged(u=>{ un();
      if(u) res(u.uid); else firebase.auth().signInAnonymously().then(c=>res(c.user.uid)).catch(e=>{ authP=null; rej(e); }); });
  });
  return authP;
}
function isDenied(e){ return /permission|denied/i.test(String((e&&(e.code||''))+' '+(e&&e.message||''))); }
function authMsg(e){
  const c=String(e&&e.code||'');
  if(/admin-restricted|operation-not-allowed/.test(c)) return '익명 로그인이 꺼져 있어요. 선생님께 알려 주세요.';
  if(isDenied(e)) return '데이터베이스가 접근을 막았어요. 선생님께 알려 주세요. ('+e.message+')';
  return '연결 오류: '+(e&&e.message||e);
}
function kicked(){ const nm=myName(); goHome(); setState(`'${nm}' 이름이 다른 기기로 넘어갔어요. 번호와 이름을 확인하고 다시 들어오세요.`); }

/* ---------- 시작 ---------- */
(function init(){
  const n=normName(LS.get('dice-name','')); if(n) $('myName').value=n;
  if(SOLO){ $('connTxt').textContent='혼자 연습 (연결 없음)'; showMain(); return; }
  let code=Q.get('c'); if(!(code&&/^\d{4}$/.test(code))) code=LS.get('dice-class',null);
  if(!FB_OK) setState('⚠ 연결 설정(firebase-config.js)이 아직 없어요.');
  if(code){ $('classCode').value=code; if(nameOk(n)) setTimeout(()=>connect(code),200); else setState('번호와 이름을 입력하고 [수업 들어가기]를 누르세요.'); }
})();
$('myName').addEventListener('change',()=>{ const v=normName($('myName').value); $('myName').value=v; LS.set('dice-name',v); });
</script>
